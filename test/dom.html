<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-jcc-theme · DOM contract</title>
    <style>
      #result { white-space: pre; font: 13px/1.6 ui-monospace, monospace; }
      .fail { color: #b00020; }
    </style>
    <script>
      try {
        localStorage.removeItem('dsh-jcc/v1')
      } catch (error) {
        /* file:// in some browsers has no storage; the bundle tolerates it */
      }
    </script>
  </head>
  <body>
    <p>Materializing the real bundle against a real DOM…</p>
    <pre id="result">running</pre>

    <script>
      window.__ModuleLoader__ = {
        load: function (definition) {
          window.__jccDefinition = definition
        }
      }
    </script>
    <script src="../client/index.js"></script>
    <script>
      ;(function () {
        var results = []
        function check(name, condition, detail) {
          results.push((condition ? 'PASS ' : 'FAIL ') + name + (condition || !detail ? '' : ' — ' + detail))
        }

        try {
          var api = window.__jccDefinition.factory(function (name) {
            throw new Error('unexpected require: ' + name)
          })

          check('module has apply()', typeof api.apply === 'function')
          check('module name', api.name === 'ui-jcc-theme')
          check('no client dependencies', Array.isArray(api.inject) && api.inject.length === 0)

          /* Materialization already ran inside factory(). */
          check('style injected early', !!document.getElementById('dsh-jcc-theme-style'))
          check('theme attribute on <html>', document.documentElement.dataset.jcc === 'on')
          check('accent attribute', document.documentElement.dataset.jccAccent === 'gold')
          check('texture attribute', document.documentElement.dataset.jccTexture === 'normal')

          var style = document.getElementById('dsh-jcc-theme-style')
          var css = style ? style.textContent : ''
          check('token block for light', css.indexOf(':root[data-jcc="on"] body:not([data-ds-dark-theme])') !== -1)
          check('token block for dark', css.indexOf(':root[data-jcc="on"] body[data-ds-dark-theme]') !== -1)
          check('four accents in the sheet', (css.match(/--jcc-accent:/g) || []).length >= 5)
          check('ambience layer present', !!document.getElementById('dsh-jcc-ambience'))
          check('launcher styles present', css.indexOf('.jcc-orb') !== -1)

          var orb = document.querySelector('.jcc-orb')
          var panel = document.getElementById('dsh-jcc-panel')
          check('orb rendered', !!orb)
          check('panel rendered and closed', !!panel && panel.hidden === true)
          check('orb collapsed', orb && orb.getAttribute('aria-expanded') === 'false')

          orb.click()
          check('panel opens', panel.hidden === false)
          check('orb expanded', orb.getAttribute('aria-expanded') === 'true')
          check('switch starts on', panel.querySelector('[data-jcc="toggle"]').getAttribute('aria-checked') === 'true')

          panel.querySelector('[data-accent="cyan"]').click()
          check('accent switches to cyan', document.documentElement.dataset.jccAccent === 'cyan')
          check('cyan swatch is pressed', panel.querySelector('[data-accent="cyan"]').getAttribute('aria-pressed') === 'true')
          check('gold swatch released', panel.querySelector('[data-accent="gold"]').getAttribute('aria-pressed') === 'false')

          panel.querySelector('[data-accent="blue"]').click()
          check('accent switches to blue', document.documentElement.dataset.jccAccent === 'blue')
          check('blue swatch is pressed', panel.querySelector('[data-accent="blue"]').getAttribute('aria-pressed') === 'true')

          panel.querySelector('[data-texture="vivid"]').click()
          check('texture switches to vivid', document.documentElement.dataset.jccTexture === 'vivid')
          check('vivid segment pressed', panel.querySelector('[data-texture="vivid"]').getAttribute('aria-pressed') === 'true')

          panel.querySelector('[data-corners="sharp"]').click()
          check('corners switch to sharp', document.documentElement.dataset.jccCorners === 'sharp')
          check('sharp segment pressed', panel.querySelector('[data-corners="sharp"]').getAttribute('aria-pressed') === 'true')

          var ambience = document.getElementById('dsh-jcc-ambience')
          check('ambience visible by default', window.getComputedStyle(ambience).display !== 'none')
          panel.querySelector('[data-jcc="ambience"]').click()
          check('ambience switches off', document.documentElement.dataset.jccAmbience === 'off')
          check('ambience hidden', window.getComputedStyle(ambience).display === 'none')
          check('ambience switch reflects off', panel.querySelector('[data-jcc="ambience"]').getAttribute('aria-checked') === 'false')

          panel.querySelector('[data-jcc="toggle"]').click()
          check('theme switches off', document.documentElement.dataset.jcc === 'off')
          check('switch reflects off', panel.querySelector('[data-jcc="toggle"]').getAttribute('aria-checked') === 'false')

          panel.querySelector('[data-jcc="reset"]').click()
          check(
            'reset restores defaults',
            document.documentElement.dataset.jcc === 'on' &&
              document.documentElement.dataset.jccAccent === 'gold' &&
              document.documentElement.dataset.jccTexture === 'normal' &&
              document.documentElement.dataset.jccAmbience === 'on' &&
              document.documentElement.dataset.jccCorners === 'soft'
          )

          /* Augment draft: three cards, three accents, one pick. */
          var draftBtn = panel.querySelector('[data-jcc="draft"]')
          check('draft entry present', !!draftBtn)
          draftBtn.click()
          var draft = document.getElementById('dsh-jcc-draft')
          check('draft opens', !!draft && draft.hidden === false)
          var draftCards = draft.querySelectorAll('.jcc-card')
          check('draft deals three cards', draftCards.length === 3)
          var draftIds = Array.prototype.map.call(draftCards, function (card) { return card.dataset.card })
          check('draft cards are distinct', new Set(draftIds).size === 3)
          var draftAccents = draftIds.map(function (id) { return id.split('-')[0] })
          check('draft accents are distinct', new Set(draftAccents).size === 3)

          var chosen = draftCards[0]
          var chosenParts = chosen.dataset.card.split('-')
          chosen.click()
          check('draft applies accent', document.documentElement.dataset.jccAccent === chosenParts[0])
          check('draft applies texture', document.documentElement.dataset.jccTexture === chosenParts[1])
          check('draft closes after pick', draft.hidden === true)
          check('collection counts the pick', panel.querySelector('[data-jcc-count]').textContent === '1')
          var savedAfterPick = JSON.parse(localStorage.getItem('dsh-jcc/v1'))
          check('collection persists', savedAfterPick.collection.length === 1)

          /* Codex: 12 slots, only owned ones usable. */
          panel.querySelector('[data-jcc="codex"]').click()
          var codex = document.getElementById('dsh-jcc-codex')
          check('codex opens', !!codex && codex.hidden === false)
          check('codex has twelve slots', codex.querySelectorAll('.jcc-codex-card').length === 12)
          var unlocked = codex.querySelectorAll('.jcc-codex-card:not([disabled])')
          check('codex unlocks only owned', unlocked.length === 1)
          var locked = codex.querySelector('.jcc-codex-card[disabled]')
          var accentBeforeLocked = document.documentElement.dataset.jccAccent
          locked.click()
          check('locked card does not apply', document.documentElement.dataset.jccAccent === accentBeforeLocked)
          check('codex stays open on locked', codex.hidden === false)
          unlocked[0].click()
          check('owned card applies and closes', codex.hidden === true)

          /* Reset is appearance-only: the collection survives. */
          panel.querySelector('[data-jcc="reset"]').click()
          check('reset keeps the collection', panel.querySelector('[data-jcc-count]').textContent === '1')

          /* Clear is a two-click action, no dialog. */
          panel.querySelector('[data-jcc="codex"]').click()
          var clearBtn = codex.querySelector('[data-jcc="clear"]')
          clearBtn.click()
          check('clear needs a second click', codex.querySelector('[data-jcc="clear"]').textContent.indexOf('再点') !== -1)
          codex.querySelector('[data-jcc="clear"]').click()
          check('collection clears', panel.querySelector('[data-jcc-count]').textContent === '0')
          check('codex locks everything', codex.querySelectorAll('.jcc-codex-card:not([disabled])').length === 0)
          check('cleared collection persists', JSON.parse(localStorage.getItem('dsh-jcc/v1')).collection.length === 0)
          codex.querySelector('[data-jcc="dismiss"]').click()
          check('codex closes', codex.hidden === true)

          /* Outside click closes the panel. */
          document.body.click()
          check('outside click closes', panel.hidden === true)

          /* Escape closes and refocuses the orb. */
          orb.click()
          document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
          check('escape closes', panel.hidden === true)

          /* The fiber lifecycle: apply() re-mounts, its disposer unloads. */
          var dispose = null
          api.apply({
            effect: function (callback) {
              dispose = callback()
            }
          })
          check('apply remounts a single orb', document.querySelectorAll('.jcc-orb').length === 1)
          check('apply keeps one panel', document.querySelectorAll('.jcc-panel').length === 1)
          check('apply keeps one style tag', document.querySelectorAll('#dsh-jcc-theme-style').length === 1)

          dispose()
          check('dispose removes the style', !document.getElementById('dsh-jcc-theme-style'))
          check('dispose removes the orb', !document.querySelector('.jcc-orb'))
          check('dispose removes the panel', !document.querySelector('.jcc-panel'))
          check('dispose removes the ambience', !document.getElementById('dsh-jcc-ambience'))
          check('dispose removes the draft', !document.getElementById('dsh-jcc-draft'))
          check('dispose removes the codex', !document.getElementById('dsh-jcc-codex'))
          check('dispose clears attributes', document.documentElement.dataset.jcc === undefined)

          var passed = results.every(function (line) {
            return line.indexOf('PASS ') === 0
          })
          document.body.dataset.test = passed ? 'PASS' : 'FAIL'
          document.getElementById('result').textContent = results.join('\n')
        } catch (error) {
          document.body.dataset.test = 'FAIL'
          document.getElementById('result').textContent =
            'FAIL threw — ' + (error && error.stack ? error.stack : String(error))
        }
      })()
    </script>
  </body>
</html>
