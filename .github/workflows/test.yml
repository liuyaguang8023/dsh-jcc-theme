name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the client bundle
        run: npm run build
      - name: Manifest and palette contracts
        run: npm test
      - name: DOM contract in headless Chrome
        run: npm run test:dom
