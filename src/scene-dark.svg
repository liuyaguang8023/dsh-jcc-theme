<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset=".42" stop-color="#070c17"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <radialGradient id="dawn" cx=".62" cy=".2" r=".6">
      <stop offset="0" stop-color="#e8c477" stop-opacity=".26"/>
      <stop offset=".42" stop-color="#e8c477" stop-opacity=".09"/>
      <stop offset="1" stop-color="#e8c477" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6e3b4" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#e8c477" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e8c477" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fbf0d2"/>
      <stop offset=".42" stop-color="#e8c477"/>
      <stop offset=".78" stop-color="#c99a2e"/>
      <stop offset="1" stop-color="#8a6413"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3b4"/>
      <stop offset="1" stop-color="#a97f2e"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".44" r=".8">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".66"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060c" stop-opacity="0"/>
      <stop offset=".62" stop-color="#04060c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#04060c" stop-opacity=".92"/>
    </linearGradient>
    <radialGradient id="crystal" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#f6e3b4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e8c477" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <symbol id="hex" viewBox="-10 -10 20 20">
      <path d="M0-10 8.66-5 8.66 5 0 10-8.66 5-8.66-5Z" fill="none" stroke="url(#gold)" stroke-width=".9"/>
    </symbol>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#dawn)"/>

  <!-- arcane dust -->
  <g fill="#f6e3b4">
    <circle cx="86" cy="92" r="1.1" opacity=".42"/>
    <circle cx="148" cy="178" r=".8" opacity=".26"/>
    <circle cx="232" cy="64" r="1.4" opacity=".5"/>
    <circle cx="318" cy="150" r=".9" opacity=".3"/>
    <circle cx="410" cy="86" r="1.1" opacity=".34"/>
    <circle cx="506" cy="190" r=".8" opacity=".22"/>
    <circle cx="596" cy="72" r="1.3" opacity=".42"/>
    <circle cx="690" cy="152" r=".9" opacity=".28"/>
    <circle cx="792" cy="58" r="1.2" opacity=".46"/>
    <circle cx="892" cy="128" r=".8" opacity=".24"/>
    <circle cx="990" cy="74" r="1.4" opacity=".4"/>
    <circle cx="1092" cy="182" r=".9" opacity=".3"/>
    <circle cx="1194" cy="92" r="1.1" opacity=".44"/>
    <circle cx="1290" cy="156" r=".8" opacity=".22"/>
    <circle cx="1392" cy="66" r="1.3" opacity=".4"/>
    <circle cx="1496" cy="148" r=".9" opacity=".3"/>
    <circle cx="64" cy="336" r=".8" opacity=".2"/>
    <circle cx="171" cy="286" r="1.1" opacity=".3"/>
    <circle cx="286" cy="360" r=".8" opacity=".18"/>
    <circle cx="382" cy="272" r="1.2" opacity=".32"/>
    <circle cx="1230" cy="300" r="1" opacity=".26"/>
    <circle cx="1338" cy="360" r=".8" opacity=".2"/>
    <circle cx="1446" cy="286" r="1.2" opacity=".3"/>
    <circle cx="1536" cy="380" r=".8" opacity=".18"/>
  </g>

  <!-- horizon -->
  <ellipse cx="800" cy="588" rx="620" ry="54" fill="url(#core)" opacity=".4"/>
  <path d="M-80 604Q800 532 1680 604" fill="none" stroke="#e8c477" stroke-opacity=".14"/>
  <path d="M-80 604Q800 546 1680 604" fill="none" stroke="#f6e3b4" stroke-opacity=".06"/>

  <!-- receding arena floor -->
  <g fill="none" stroke="#e8c477" stroke-opacity=".09">
    <path d="M800 566L-260 1000M800 566L-40 1000M800 566L180 1000M800 566L400 1000M800 566L620 1000M800 566L800 1000M800 566L980 1000M800 566L1200 1000M800 566L1420 1000M800 566L1620 1000M800 566L1860 1000"/>
    <path d="M-140 690Q800 628 1740 690" stroke-opacity=".07"/>
    <path d="M-140 772Q800 706 1740 772" stroke-opacity=".08"/>
    <path d="M-140 872Q800 798 1740 872" stroke-opacity=".09"/>
    <path d="M-140 990Q800 900 1740 990" stroke-opacity=".1"/>
  </g>

  <!-- hex arena: three tiers + rune ticks -->
  <g fill="none" stroke="url(#gold)">
    <path d="M800 280 1215.7 520V1000L800 1240 384.3 1000V520Z" stroke-opacity=".14" stroke-width="1.2"/>
    <path d="M800 460 1059.8 610v300L800 1060 540.2 910V610Z" stroke-opacity=".22" stroke-width="1.4"/>
    <path d="M800 610 940 690v160L800 930 660 850V690Z" stroke-opacity=".3" stroke-width="1.6"/>
    <circle cx="800" cy="770" r="472" stroke-dasharray="2 18" stroke-opacity=".16"/>
  </g>

  <!-- platform glow -->
  <ellipse cx="800" cy="792" rx="230" ry="70" fill="url(#core)" opacity=".55" filter="url(#bloom)"/>

  <!-- the golden spatula, an original geometric mark -->
  <ellipse cx="1470" cy="300" rx="260" ry="240" fill="url(#core)" opacity=".42" filter="url(#soft)"/>
  <path d="M1470 120 1625.9 210V390L1470 480 1314.1 390V210Z" fill="none" stroke="url(#gold)" stroke-opacity=".14" stroke-width="1.2"/>

  <g transform="translate(1470 300) rotate(-12) scale(11.5) translate(-12 -12)" opacity=".26">
    <ellipse cx="12" cy="13" rx="22" ry="18" fill="url(#crystal)" opacity=".5" filter="url(#soft)"/>
    <g fill="url(#gold)">
      <path d="M14.4 3.2c1.9-.6 3.9-.3 5.5 1.1 1.4 1.6 1.7 3.6 1.1 5.5-.2.8-.7 1.5-1.3 2.1l-1.1 1.1-7.4-7.4 1.1-1.1c.6-.6 1.3-1.1 2.1-1.3Z"/>
      <path d="M11.7 8.2 4.2 15.7" stroke="url(#handle)" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- floating hex crystals -->
  <g>
    <use href="#hex" x="214" y="196" width="34" height="34" opacity=".36"/>
    <use href="#hex" x="1228" y="452" width="22" height="22" opacity=".24"/>
    <use href="#hex" x="408" y="548" width="30" height="30" opacity=".26"/>
    <use href="#hex" x="1464" y="742" width="26" height="26" opacity=".2"/>
    <use href="#hex" x="118" y="764" width="20" height="20" opacity=".18"/>
    <use href="#hex" x="1058" y="140" width="16" height="16" opacity=".28"/>
    <use href="#hex" x="596" y="228" width="18" height="18" opacity=".22"/>
    <circle cx="231" cy="212" r="2" fill="#f6e3b4" opacity=".4"/>
    <circle cx="1238" cy="463" r="1.6" fill="#f6e3b4" opacity=".34"/>
    <circle cx="421" cy="563" r="2" fill="#f6e3b4" opacity=".3"/>
  </g>

  <!-- frame light -->
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect y="560" width="1600" height="440" fill="url(#floor)"/>
</svg>
